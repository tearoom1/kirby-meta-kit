label: meta-kit.bp.site-seo-group.label
type: group
fields:
  seoReview:
    label: meta-kit.bp.meta-group.seoReview.label
    type: mk-review

  appendSiteName:
    label: meta-kit.bp.site-seo-group.appendSiteName.label
    type: toggle
    text:
      - 'No'
      - 'Yes'
    default: true
    help: meta-kit.bp.site-seo-group.appendSiteName.help
    width: 1/4

  appendSiteNameTo:
    label: meta-kit.bp.site-seo-group.appendSiteNameTo.label
    type: checkboxes
    columns: 2
    options:
      meta: "Meta Title"
      og: "OG Title"
    default:
      - meta
      - og
    when:
      appendSiteName: true
    width: 1/4

  metaTitle:
    label: meta-kit.bp.site-seo-group.metaTitle.label
    type: text
    placeholder: "{{ site.title }}"
    help: meta-kit.bp.site-seo-group.metaTitle.help
    when:
      appendSiteName: true
    width: 1/4

  titleSeparator:
    label: meta-kit.bp.site-seo-group.titleSeparator.label
    type: select
    options:
      - value: '|'
        text:
          '*': meta-kit.bp.site-seo-group.option.pipe
      - value: '-'
        text:
          '*': meta-kit.bp.site-seo-group.option.dash
      - value: '–'
        text:
          '*': meta-kit.bp.site-seo-group.option.en-dash
      - value: '—'
        text:
          '*': meta-kit.bp.site-seo-group.option.em-dash
      - value: '•'
        text:
          '*': meta-kit.bp.site-seo-group.option.bullet
      - value: '/'
        text:
          '*': meta-kit.bp.site-seo-group.option.slash
    default: '|'
    help: meta-kit.bp.site-seo-group.titleSeparator.help
    when:
      appendSiteName: true
    width: 1/4

  metaDescription:
    label: meta-kit.bp.site-seo-group.metaDescription.label
    type: mk-description
    fieldType: meta
    maxlength: 180
    help: meta-kit.bp.site-seo-group.metaDescription.help
    width: 1/2

  metaAuthor:
    label: meta-kit.bp.site-seo-group.metaAuthor.label
    type: text
    help: meta-kit.bp.site-seo-group.metaAuthor.help
    width: 1/4

  robots:
    label: meta-kit.bp.site-seo-group.robots.label
    type: select
    options:
      - value: 'index, follow'
        text:
          '*': meta-kit.bp.meta-group.option.index-follow
      - value: 'noindex, follow'
        text:
          '*': meta-kit.bp.meta-group.option.no-index-follow
      - value: 'index, nofollow'
        text:
          '*': meta-kit.bp.meta-group.option.index-no-follow
      - value: 'noindex, nofollow'
        text:
          '*': meta-kit.bp.meta-group.option.no-index-no-follow
    width: 1/4
    translate: false

  ogImage:
    label: meta-kit.bp.site-seo-group.ogImage.label
    type: files
    max: 1
    layout: cards
    image:
      ratio: 120/63
      cover: true
    size: large
    query: site.images
    help: meta-kit.bp.site-seo-group.ogImage.help
    width: 1/2

  schemaHeadline:
    label: meta-kit.bp.site-seo-group.schemaHeadline.label
    type: headline
    numbered: false

  schemaInfo:
    type: info
    text: meta-kit.bp.site-seo-group.schemaInfo.text
    theme: positive

  schemaType:
    label: meta-kit.bp.site-seo-group.schemaType.label
    type: select
    options:
      - value: 'Organization'
        text:
          '*': meta-kit.bp.site-seo-group.option.organization
      - value: 'Person'
        text:
          '*': meta-kit.bp.site-seo-group.option.person
    default: Organization
    width: 1/3
    translate: false

  schemaName:
    label: meta-kit.bp.site-seo-group.schemaName.label
    type: text
    placeholder: "{{ site.title }}"
    help: meta-kit.bp.site-seo-group.schemaName.help
    width: 1/3
    translate: false

  schemaEmail:
    label: meta-kit.bp.site-seo-group.schemaEmail.label
    type: email
    width: 1/3
    translate: false

  schemaJobTitle:
    label: meta-kit.bp.site-seo-group.schemaJobTitle.label
    type: text
    help: meta-kit.bp.site-seo-group.schemaJobTitle.help
    width: 1/2
    when:
      schemaType: Person
    translate: false
