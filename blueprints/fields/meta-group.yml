type: group
label: meta-kit.bp.meta-group.label
fields:
  slugInfo:
    label: meta-kit.bp.meta-group.slugInfo.label
    type: mk-slug-info

  seoReview:
    label: meta-kit.bp.meta-group.seoReview.label
    type: mk-review

  metaTitle:
    label: meta-kit.bp.meta-group.metaTitle.label
    type: mk-title
    fieldType: meta
    help: meta-kit.bp.meta-group.metaTitle.help

  metaDescription:
    label: meta-kit.bp.meta-group.metaDescription.label
    type: mk-description
    fieldType: meta
    maxlength: 180
    help: meta-kit.bp.meta-group.metaDescription.help

  metaAuthor:
    label: meta-kit.bp.meta-group.metaAuthor.label
    type: text
    help: meta-kit.bp.meta-group.metaAuthor.help
    width: 1/2

  canonicalUrl:
    label: meta-kit.bp.meta-group.canonicalUrl.label
    type: url
    help: meta-kit.bp.meta-group.canonicalUrl.help
    width: 1/2

  robots:
    label: meta-kit.bp.meta-group.robots.label
    type: select
    options:
      - value: 'index, follow'
        text:
          '*': meta-kit.bp.meta-group.option.index-follow
      - value: 'noindex, follow'
        text:
          '*': meta-kit.bp.meta-group.option.no-index-follow
      - value: 'index, nofollow'
        text:
          '*': meta-kit.bp.meta-group.option.index-no-follow
      - value: 'noindex, nofollow'
        text:
          '*': meta-kit.bp.meta-group.option.no-index-no-follow
    width: 1/2
    translate: false

  seoSocialSeparator:
    label:
    type: info
    text: meta-kit.bp.meta-group.seoSocialSeparator.text
    theme: positive

  ogTitle:
    label: meta-kit.bp.meta-group.ogTitle.label
    type: mk-title
    fieldType: og
    help: meta-kit.bp.meta-group.ogTitle.help

  ogDescription:
    label: meta-kit.bp.meta-group.ogDescription.label
    type: mk-description
    fieldType: og
    maxlength: 310
    help: meta-kit.bp.meta-group.ogDescription.help

  ogImage:
    label: meta-kit.bp.meta-group.ogImage.label
    type: files
    max: 1
    layout: cards
    image:
      ratio: 120/63
      cover: true
    size: medium
    query: page.images
    help: meta-kit.bp.meta-group.ogImage.help
