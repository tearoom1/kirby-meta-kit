name: meta-kit.bp.robots.name
preview: fields
wysiwyg: true
tabs:
  general:
    label: meta-kit.bp.robots.general.label
    fields:
      info:
        type: info
        label: meta-kit.bp.robots.general.info.label
        text: meta-kit.bp.robots.general.info.text
        theme: info
        translate: false
      enabled:
        label: meta-kit.bp.robots.general.enabled.label
        type: toggle
        default: true
        help: meta-kit.bp.robots.general.enabled.help
        width: 1/3
        translate: false
      defaultRules:
        label: meta-kit.bp.robots.general.defaultRules.label
        type: toggle
        default: true
        help: meta-kit.bp.robots.general.defaultRules.help
        when:
          enabled: true
        width: 1/3
        translate: false
      includeSitemap:
        label: meta-kit.bp.robots.general.includeSitemap.label
        type: toggle
        default: true
        help: meta-kit.bp.robots.general.includeSitemap.help
        when:
          enabled: true
        width: 1/3
        translate: false
      customRules:
        label: meta-kit.bp.robots.general.customRules.label
        type: structure
        help: meta-kit.bp.robots.general.customRules.help
        when:
          enabled: true
        translate: false
        fields:
          userAgent:
            label: meta-kit.bp.robots.general.customRules.userAgent.label
            type: select
            default: "*"
            options:
              - value: '*'
                text:
                  '*': meta-kit.bp.robots.option.all-bots
              - { value: 'Googlebot', text: 'Googlebot' }
              - { value: 'Googlebot-Image', text: 'Googlebot-Image' }
              - { value: 'Googlebot-News', text: 'Googlebot-News' }
              - { value: 'Bingbot', text: 'Bingbot' }
              - { value: 'Slurp', text: 'Yahoo Slurp' }
              - { value: 'DuckDuckBot', text: 'DuckDuckBot' }
              - { value: 'Baiduspider', text: 'Baiduspider' }
              - { value: 'YandexBot', text: 'YandexBot' }
              - { value: 'facebookexternalhit', text: 'Facebook' }
              - { value: 'Twitterbot', text: 'Twitter' }
              - { value: 'LinkedInBot', text: 'LinkedIn' }
              - value: 'custom'
                text:
                  '*': meta-kit.bp.robots.option.custom-user-agent
            help: meta-kit.bp.robots.general.customRules.userAgent.help
          customUserAgent:
            label: meta-kit.bp.robots.general.customRules.customUserAgent.label
            type: text
            placeholder: meta-kit.bp.robots.general.customRules.customUserAgent.placeholder
            when:
              userAgent: custom
            help: meta-kit.bp.robots.general.customRules.customUserAgent.help
          allowPaths:
            label: meta-kit.bp.robots.general.customRules.allowPaths.label
            type: tags
            placeholder: /images/, /public/
            help: meta-kit.bp.robots.general.customRules.allowPaths.help
          disallowPaths:
            label: meta-kit.bp.robots.general.customRules.disallowPaths.label
            type: tags
            placeholder: /admin/, /private/
            help: meta-kit.bp.robots.general.customRules.disallowPaths.help
          crawlDelay:
            label: meta-kit.bp.robots.general.customRules.crawlDelay.label
            type: number
            min: 0
            max: 60
            step: 1
            placeholder: 0
            help: meta-kit.bp.robots.general.customRules.crawlDelay.help
  advanced:
    label: meta-kit.bp.robots.advanced.label
    fields:
      blockBadBots:
        label: meta-kit.bp.robots.advanced.blockBadBots.label
        type: toggle
        default: false
        help: meta-kit.bp.robots.advanced.blockBadBots.help
        when:
          enabled: true
        translate: false
      blockAiCrawlers:
        label: meta-kit.bp.robots.advanced.blockAiCrawlers.label
        type: toggle
        default: false
        help: meta-kit.bp.robots.advanced.blockAiCrawlers.help
        when:
          enabled: true
        translate: false
      llmsTxt:
        label: meta-kit.bp.robots.advanced.llmsTxt.label
        type: toggle
        default: false
        help: meta-kit.bp.robots.advanced.llmsTxt.help
        translate: false
      customDirectives:
        label: meta-kit.bp.robots.advanced.customDirectives.label
        type: textarea
        placeholder: |
          Host: example.com
          Request-rate: 1/1
        help: meta-kit.bp.robots.advanced.customDirectives.help
        font: monospace
        when:
          enabled: true
        translate: false
