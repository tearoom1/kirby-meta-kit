name: OpenRouter Settings
icon: ai
preview: fields
wysiwyg: true
fields:
  infoAi:
    type: info
    label: AI Integration
    text: AI features will be automatically disabled if the API key and model is not configured either here or in the config.
    theme: info
    translate: false
  apiKey:
    label: OpenRouter API Key
    type: text
    help: Your OpenRouter API key for AI-generated descriptions. Leave empty to disable AI features.
    width: 1/2
    translate: false
  model:
    label: AI Model
    type: select
    options:
      - { value: 'google/gemma-4-31b-it:free', text: 'Gemma 4 31B (Free test model)' }
      - { value: 'google/gemma-4-26b-a4b-it:free', text: 'Gemma 4 26B A4B (Free test model)' }
      - { value: 'openai/gpt-6-luna', text: 'GPT-6 Luna (Paid)' }
      - { value: 'openai/gpt-6-sol', text: 'GPT-6 Sol (Paid)' }
      - { value: 'openai/gpt-5-mini', text: 'GPT-5 Mini (Paid)' }
      - { value: 'openai/gpt-5', text: 'GPT-5 (Paid)' }
      - { value: 'openai/gpt-4o-mini', text: 'GPT-4o Mini (Paid)' }
      - { value: 'openai/gpt-4o', text: 'GPT-4o (Paid)' }
      - { value: 'anthropic/claude-haiku-5.5', text: 'Claude Haiku 5.5 (Paid)' }
      - { value: 'anthropic/claude-sonnet-5.5', text: 'Claude Sonnet 5.5 (Paid)' }
      - { value: 'anthropic/claude-haiku-4.5', text: 'Claude Haiku 4.5 (Paid)' }
      - { value: 'anthropic/claude-sonnet-4.5', text: 'Claude Sonnet 4.5 (Paid)' }
      - { value: 'google/gemini-3.5-flash', text: 'Gemini 3.5 Flash (Paid)' }
      - { value: 'google/gemini-3.1-flash-lite', text: 'Gemini 3.1 Flash Lite (Paid)' }
      - { value: 'mistralai/mistral-large-4-0', text: 'Mistral Large 4 (Paid)' }
      - { value: 'mistralai/mistral-large', text: 'Mistral Large (Paid)' }
      - { value: 'meta-llama/llama-3.3-70b-instruct', text: 'Llama 3.3 70B (Paid)' }
      - { value: 'deepseek/deepseek-v4-flash', text: 'DeepSeek V4 Flash (Paid)' }
      - { value: 'deepseek/deepseek-chat', text: 'DeepSeek Chat V3 (Paid)' }
      - { value: 'custom', text: 'Other model (enter model ID)' }
    default: "google/gemma-4-31b-it:free"
    width: 1/2
    translate: false
  customModel:
    label: Custom Model ID
    type: text
    placeholder: openai/gpt-6-luna
    help: Any model ID from <a href="https://openrouter.ai/models" target="_blank">openrouter.ai/models</a>
    width: 1/2
    translate: false
    when:
      model: custom
  temperature:
    label: Creativity Level
    type: range
    min: 0.1
    max: 1.0
    step: 0.1
    default: 0.7
    width: 1/2
    help: Higher values make output more random, lower values more focused. Ignored by models that don't support it.
    translate: false
  reasoning:
    label: Reasoning Effort
    type: select
    options:
      - { value: 'none', text: 'None (fastest)' }
      - { value: 'minimal', text: 'Minimal' }
      - { value: 'low', text: 'Low' }
      - { value: 'medium', text: 'Medium' }
      - { value: 'high', text: 'High' }
    placeholder: Model default
    width: 1/2
    help: How long reasoning models (GPT-5/6, Gemini 3, …) think before answering. Lower is faster and cheaper. Leave empty to use the model's default. Ignored by models without reasoning.
    translate: false
