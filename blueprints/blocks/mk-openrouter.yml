name: meta-kit.bp.openrouter.name
icon: ai
preview: fields
wysiwyg: true
fields:
  infoAi:
    type: info
    label: meta-kit.bp.openrouter.infoAi.label
    text: meta-kit.bp.openrouter.infoAi.text
    theme: info
    translate: false
  provider:
    label: meta-kit.bp.openrouter.provider.label
    type: select
    placeholder: OpenRouter
    options:
      - value: 'mistral'
        text:
          '*': meta-kit.bp.openrouter.option.mistral-eu
      - value: 'custom'
        text:
          '*': meta-kit.bp.openrouter.option.other-openai-compatible-api
    help: meta-kit.bp.openrouter.provider.help
    width: 1/2
    translate: false
  apiKey:
    label: meta-kit.bp.openrouter.apiKey.label
    type: text
    help: meta-kit.bp.openrouter.apiKey.help
    width: 1/2
    translate: false
  endpoint:
    label: meta-kit.bp.openrouter.endpoint.label
    type: url
    placeholder: https://example.com/v1/chat/completions
    help: meta-kit.bp.openrouter.endpoint.help
    width: 1/2
    translate: false
    when:
      provider: custom
  model:
    label: meta-kit.bp.openrouter.mistralModel.label
    type: select
    when:
      provider: ''
    options:
      - value: 'google/gemma-4-31b-it:free'
        text:
          '*': meta-kit.bp.openrouter.option.gemma-4-31b-free-test-model
      - value: 'google/gemma-4-26b-a4b-it:free'
        text:
          '*': meta-kit.bp.openrouter.option.gemma-4-26b-a4b-free-test-model
      - value: 'openai/gpt-6-luna'
        text:
          '*': meta-kit.bp.openrouter.option.gpt-6-luna-paid
      - value: 'openai/gpt-6-sol'
        text:
          '*': meta-kit.bp.openrouter.option.gpt-6-sol-paid
      - value: 'openai/gpt-5-mini'
        text:
          '*': meta-kit.bp.openrouter.option.gpt-5-mini-paid
      - value: 'openai/gpt-5'
        text:
          '*': meta-kit.bp.openrouter.option.gpt-5-paid
      - value: 'openai/gpt-4o-mini'
        text:
          '*': meta-kit.bp.openrouter.option.gpt-4o-mini-paid
      - value: 'openai/gpt-4o'
        text:
          '*': meta-kit.bp.openrouter.option.gpt-4o-paid
      - value: 'anthropic/claude-haiku-5.5'
        text:
          '*': meta-kit.bp.openrouter.option.claude-haiku-5-5-paid
      - value: 'anthropic/claude-sonnet-5.5'
        text:
          '*': meta-kit.bp.openrouter.option.claude-sonnet-5-5-paid
      - value: 'anthropic/claude-haiku-4.5'
        text:
          '*': meta-kit.bp.openrouter.option.claude-haiku-4-5-paid
      - value: 'anthropic/claude-sonnet-4.5'
        text:
          '*': meta-kit.bp.openrouter.option.claude-sonnet-4-5-paid
      - value: 'google/gemini-3.5-flash'
        text:
          '*': meta-kit.bp.openrouter.option.gemini-3-5-flash-paid
      - value: 'google/gemini-3.1-flash-lite'
        text:
          '*': meta-kit.bp.openrouter.option.gemini-3-1-flash-lite-paid
      - value: 'mistralai/mistral-large-4-0'
        text:
          '*': meta-kit.bp.openrouter.option.mistral-large-4-paid
      - value: 'mistralai/mistral-large'
        text:
          '*': meta-kit.bp.openrouter.option.mistral-large-paid
      - value: 'meta-llama/llama-3.3-70b-instruct'
        text:
          '*': meta-kit.bp.openrouter.option.llama-3-3-70b-paid
      - value: 'deepseek/deepseek-v4-flash'
        text:
          '*': meta-kit.bp.openrouter.option.deepseek-v4-flash-paid
      - value: 'deepseek/deepseek-chat'
        text:
          '*': meta-kit.bp.openrouter.option.deepseek-chat-v3-paid
      - value: 'custom'
        text:
          '*': meta-kit.bp.openrouter.option.other-model-enter-model-id
    default: "google/gemma-4-31b-it:free"
    width: 1/2
    translate: false
  customModel:
    label: meta-kit.bp.openrouter.customModel.label
    type: text
    placeholder: openai/gpt-6-luna
    help: meta-kit.bp.openrouter.customModel.help
    width: 1/2
    translate: false
    when:
      provider: ''
      model: custom
  mistralModel:
    label: meta-kit.bp.openrouter.mistralModel.label
    type: select
    placeholder: meta-kit.bp.openrouter.mistralModel.placeholder
    options:
      - { value: 'mistral-small-latest', text: 'Mistral Small' }
      - { value: 'mistral-medium-latest', text: 'Mistral Medium' }
      - { value: 'mistral-large-latest', text: 'Mistral Large' }
    help: meta-kit.bp.openrouter.mistralModel.help
    width: 1/2
    translate: false
    when:
      provider: mistral
  endpointModel:
    label: meta-kit.bp.openrouter.endpointModel.label
    type: text
    placeholder: llama3.3
    help: meta-kit.bp.openrouter.endpointModel.help
    width: 1/2
    translate: false
    when:
      provider: custom
  temperature:
    label: meta-kit.bp.openrouter.temperature.label
    type: range
    min: 0.1
    max: 1.0
    step: 0.1
    default: 0.7
    width: 1/2
    help: meta-kit.bp.openrouter.temperature.help
    translate: false
  reasoning:
    label: meta-kit.bp.openrouter.reasoning.label
    type: select
    options:
      - value: 'none'
        text:
          '*': meta-kit.bp.openrouter.option.none-fastest
      - value: 'minimal'
        text:
          '*': meta-kit.bp.openrouter.option.minimal
      - value: 'low'
        text:
          '*': meta-kit.bp.openrouter.option.low
      - value: 'medium'
        text:
          '*': meta-kit.bp.openrouter.option.medium
      - value: 'high'
        text:
          '*': meta-kit.bp.openrouter.option.high
    placeholder: meta-kit.bp.openrouter.reasoning.placeholder
    width: 1/2
    help: meta-kit.bp.openrouter.reasoning.help
    translate: false
