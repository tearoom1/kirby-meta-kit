name: meta-kit.bp.sitemap.name
icon: sitemap
preview: fields
wysiwyg: true
fields:
  exclude:
    label: meta-kit.bp.sitemap.exclude.label
    type: pages
    multiple: true
    help: meta-kit.bp.sitemap.exclude.help
    translate: false
  includeUnlisted:
    label: meta-kit.bp.sitemap.includeUnlisted.label
    type: toggle
    default: false
    help: meta-kit.bp.sitemap.includeUnlisted.help
    translate: false
    width: 1/2
  changefreqDefault:
    label: meta-kit.bp.sitemap.changefreqDefault.label
    type: select
    options:
      always: Always
      hourly: Hourly
      daily: Daily
      weekly: Weekly
      monthly: Monthly
      yearly: Yearly
      never: Never
    default: monthly
    width: 1/2
    help: meta-kit.bp.sitemap.changefreqDefault.help
    translate: false
  priorityHome:
    label: meta-kit.bp.sitemap.priorityHome.label
    type: range
    min: 0.1
    max: 1.0
    step: 0.1
    default: 1.0
    width: 1/2
    translate: false
  priorityDefault:
    label: meta-kit.bp.sitemap.priorityDefault.label
    type: range
    min: 0.0
    max: 1.0
    step: 0.1
    default: 0.8
    width: 1/2
    help: meta-kit.bp.sitemap.priorityDefault.help
    translate: false
