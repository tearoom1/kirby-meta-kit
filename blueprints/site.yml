label: meta-kit.bp.site.label
icon: search
columns:
  seo:
    type: fields
    label: meta-kit.bp.page.label
    icon: seo
    fields:
      seoSettings:
        extends: fields/site-seo-group

  social:
    width: 1/1
    type: fields
    label: meta-kit.bp.site.social.label
    icon: share
    fields:
      metaKitSocialSites:
        label: meta-kit.bp.site.social.metaKitSocialSites.label
        type: structure
        fields:
          platform:
            label: meta-kit.bp.site.social.metaKitSocialSites.platform.label
            type: select
            options:
              - { value: 'facebook', text: 'Facebook' }
              - { value: 'twitter', text: 'X (Twitter)' }
              - { value: 'instagram', text: 'Instagram' }
              - { value: 'linkedin', text: 'LinkedIn' }
              - { value: 'youtube', text: 'YouTube' }
              - { value: 'tiktok', text: 'TikTok' }
              - { value: 'pinterest', text: 'Pinterest' }
              - { value: 'github', text: 'GitHub' }
          url:
            label: meta-kit.bp.site.social.metaKitSocialSites.url.label
            type: url

  otherSettings:
    width: 1/1
    type: fields
    fields:
      otherSettings:
        label:
        type: info
        text: meta-kit.bp.site.otherSettings.otherSettings.text
        theme: positive

  openrouter:
    width: 1/2
    type: fields
    label: meta-kit.bp.site.openrouter.label
    icon: ai
    fields:
      metaKitOpenrouter:
        label: meta-kit.bp.site.openrouter.metaKitOpenrouter.label
        type: blocks
        fieldsets:
          - mk-openrouter
        max: 1
        empty: false
        pretty: true

  sitemap:
    width: 1/2
    type: fields
    label: meta-kit.bp.site.sitemap.label
    icon: sitemap
    fields:
      metaKitSitemap:
        label: meta-kit.bp.site.sitemap.metaKitSitemap.label
        type: blocks
        fieldsets:
          - mk-sitemap
        max: 1
        empty: false
        pretty: true

  redirects:
    width: 1/1
    type: fields
    label: meta-kit.bp.site.redirects.metaKitRedirects.label
    icon: shuffle
    fields:
      metaKitRedirects:
        label: meta-kit.bp.site.redirects.metaKitRedirects.label
        type: structure
        help: meta-kit.bp.site.redirects.metaKitRedirects.help
        translate: false
        sortBy: created desc
        columns:
          from: true
          to: true
          created: true
        fields:
          from:
            label: meta-kit.bp.site.redirects.metaKitRedirects.from.label
            type: text
            placeholder: /journal/old-slug
            required: true
          to:
            label: meta-kit.bp.site.redirects.metaKitRedirects.to.label
            type: pages
            max: 1
            required: true
          language:
            label: meta-kit.bp.site.redirects.metaKitRedirects.language.label
            type: text
            width: 1/2
            help: meta-kit.bp.site.redirects.metaKitRedirects.language.help
          created:
            label: meta-kit.bp.site.redirects.metaKitRedirects.created.label
            type: date
            time: true
            width: 1/2

  robots:
    width: 1/1
    type: fields
    label: meta-kit.bp.site.robots.label
    icon: robot
    fields:
      metaKitRobots:
        label: meta-kit.bp.site.robots.metaKitRobots.label
        type: blocks
        help: meta-kit.bp.site.robots.metaKitRobots.help
        fieldsets:
          - mk-robots
        max: 1
        empty: false
        pretty: true
